[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-google-serp-api"
version = "0.1.0"
description = "Google SERP API for Python and the command line: organic results with the AI Overview, news, images, local places, autocomplete and Google Trends as JSON or CSV. Free and open source; sign in with your QuanticData account, no Google API key or proxies needed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["google-serp-api", "serp-api", "google-search-api", "google-search-scraper", "google-scraper", "serp", "seo", "rank-tracker", "ai-overview", "google-trends-api", "google-news-scraper", "google-image-scraper"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
google-serp = "quanticdata_google_serp_api.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/serp-api/?utm_source=github&utm_medium=pypi&utm_campaign=google-serp-api"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/google-serp-api"
Issues = "https://github.com/quantumproxies/google-serp-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_google_serp_api" = ["spec.json", "py.typed"]
